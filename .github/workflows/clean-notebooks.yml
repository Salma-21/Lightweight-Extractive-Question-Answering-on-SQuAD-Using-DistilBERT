name: Clean Notebooks

on:
  push:
    paths: ['**.ipynb']

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean notebooks
        run: python3 clean.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: remove widgets metadata only"
